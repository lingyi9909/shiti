[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "question-builder"
version = "0.1.0"
description = "Precision-first, traceable K12 DOCX question structuring pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "python-docx>=1.1,<2",
  "lxml>=5,<7",
  "PyYAML>=6,<7",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
qbuilder = "question_builder.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

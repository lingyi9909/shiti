name: Task 6 Compact Edge RED

on:
  push:
    branches:
      - task6-compact-edge-red-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: 106e29fcbd2fca436fd36055423d84c6d457e8d9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compact completeness RED
        run: python -m pytest tests/unit/answer/test_compact_completeness_edge.py -v

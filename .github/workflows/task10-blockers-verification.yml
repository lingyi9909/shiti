name: Task 10 Blocker Verification

on:
  push:
    branches:
      - task10-blockers-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 10 blocker RED head
        uses: actions/checkout@v4
        with:
          ref: 37b6ceb61aef1ad0a686428f65e785f66bfb91e8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 10 blocker RED
        run: python -m pytest tests/unit/cache/test_calibration_cache_blockers.py tests/unit/storage/test_provider_call_provenance.py -v

name: Task 6 Final Answer RED

on:
  push:
    branches: [task6-verification-final-answer-red]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 6 head
        uses: actions/checkout@v4
        with:
          ref: f8c8f26d8ae2ad87faf02d564365a44762497e73
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 6 tests
        run: python -m pytest tests/unit/answer -v

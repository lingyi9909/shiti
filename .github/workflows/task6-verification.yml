name: Task 6 Verification

on:
  push:
    branches: [task6-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 6 head
        uses: actions/checkout@v4
        with:
          ref: f27045d91dae10086120d1d210d6acdcd04a3d8f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 6 tests
        run: python -m pytest tests/unit/answer -v

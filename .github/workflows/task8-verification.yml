name: Task 8 Verification

on:
  push:
    branches:
      - task8-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 8 GREEN head
        uses: actions/checkout@v4
        with:
          ref: 90460722e0d7961809e2b2d836839a955dec00bc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 8 GREEN
        run: python -m pytest tests/unit/metadata tests/unit/export/test_final_contract.py -v
      - name: Domain regression
        run: python -m pytest tests/unit/test_domain_models.py -v

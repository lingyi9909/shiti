name: Task 8 Verification

on:
  push:
    branches:
      - task8-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 8 full verification head
        uses: actions/checkout@v4
        with:
          ref: 90460722e0d7961809e2b2d836839a955dec00bc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 8 metadata and final contract
        run: python -m pytest tests/unit/metadata tests/unit/export/test_final_contract.py -v
      - name: Task 7 matching regression
        run: python -m pytest tests/unit/matching tests/golden/test_answer_matching_precision.py -v
      - name: Task 6 answer regression
        run: python -m pytest tests/unit/answer -v
      - name: Task 5 splitter regression
        run: python -m pytest tests/unit/splitter tests/golden/test_question_reconstruction.py -v
      - name: Task 4 understanding regression
        run: python -m pytest tests/unit/understanding -v
      - name: Task 3 recognition regression
        run: python -m pytest tests/contract tests/unit/recognition -v
      - name: Task 0-2 regression
        run: python -m pytest tests/unit/test_config.py tests/unit/test_domain_models.py tests/unit/parser tests/golden/test_basic_document_ir.py tests/golden/test_advanced_document_ir.py -v
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/question_builder/config src/question_builder/domain src/question_builder/parser src/question_builder/recognition src/question_builder/understanding src/question_builder/splitter src/question_builder/answer src/question_builder/matching src/question_builder/metadata src/question_builder/export

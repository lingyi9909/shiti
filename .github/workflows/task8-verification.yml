name: Task 8 Verification

on:
  push:
    branches:
      - task8-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 8 behavior RED head
        uses: actions/checkout@v4
        with:
          ref: f059b2f48817afe1dd79201a43d770f3c76f4be7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 8 behavior RED
        run: python -m pytest tests/unit/metadata tests/unit/export/test_final_contract.py -v

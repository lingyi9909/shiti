name: Task 6 RED Verification

on:
  push:
    branches: [task6-verification-red]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 6 head
        uses: actions/checkout@v4
        with:
          ref: 051d57c92d4d5ef134a69170f0c4f47252f16d20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 6 tests
        run: python -m pytest tests/unit/answer -v

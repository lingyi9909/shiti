name: Task 5 Verification

on:
  push:
    branches: [task5-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 5 head
        uses: actions/checkout@v4
        with:
          ref: 1e4a8bc34977c54cd1bfb4006b069bc7e039ee5e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Capture Ruff diagnostics
        run: python -m ruff check src tests > ruff.txt 2>&1 || true
      - name: Upload Ruff diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: task5-ruff-diagnostics
          path: ruff.txt

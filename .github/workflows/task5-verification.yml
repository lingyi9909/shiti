name: Task 5 Verification

on:
  push:
    branches: [task5-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 5 head
        uses: actions/checkout@v4
        with:
          ref: a6755959e9a782668c4f68179e8b718426e6fe4c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 5 tests
        run: python -m pytest tests/unit/splitter tests/golden/test_question_reconstruction.py -v

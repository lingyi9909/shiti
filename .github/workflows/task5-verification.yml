name: Task 5 Verification

on:
  push:
    branches: [task5-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 5 head
        uses: actions/checkout@v4
        with:
          ref: 0ad2248ddb49e0e5d0cc0625c793ede01b19f2b8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 5 tests
        run: python -m pytest tests/unit/splitter tests/golden/test_question_reconstruction.py -v

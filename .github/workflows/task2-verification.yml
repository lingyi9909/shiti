name: Task 2 Verification

on:
  push:
    branches: [task2-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 2 head
        uses: actions/checkout@v4
        with:
          ref: f9b5750a718247d28f72cdf5088b4a4e59581a47
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 2 parser tests
        run: python -m pytest tests/unit/parser tests/golden/test_advanced_document_ir.py -v
      - name: Task 0 regression
        run: python -m pytest tests/unit/test_config.py tests/unit/test_domain_models.py -v
      - name: Task 1 golden regression
        run: python -m pytest tests/golden/test_basic_document_ir.py -v
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/question_builder/config src/question_builder/domain src/question_builder/parser

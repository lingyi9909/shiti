name: Task 2 Verification

on:
  push:
    branches: [task2-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 2 head
        uses: actions/checkout@v4
        with:
          ref: b5ee1c2776f980da6b8b8698ca1d3fb42993b9d6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 2 parser tests
        run: python -m pytest tests/unit/parser -v

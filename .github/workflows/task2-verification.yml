name: Task 2 Verification

on:
  push:
    branches: [task2-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 2 head
        uses: actions/checkout@v4
        with:
          ref: 80fe0c5a34a33d45c0598b476dd6d5f3c9e17416
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 2 parser tests
        run: python -m pytest tests/unit/parser/test_task2_blockers.py -v

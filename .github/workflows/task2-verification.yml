name: Task 2 Verification

on:
  push:
    branches: [task2-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 2 head
        uses: actions/checkout@v4
        with:
          ref: ad8a939dbfc8a2c3d83893fe3afb8f91a52b13b8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 2 parser tests
        run: python -m pytest tests/unit/parser -v
      - name: Task 0 regression
        run: python -m pytest tests/unit/test_config.py tests/unit/test_domain_models.py -v
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/question_builder/config src/question_builder/domain src/question_builder/parser

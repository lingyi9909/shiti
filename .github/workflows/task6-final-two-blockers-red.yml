name: Task 6 Final Two Blockers GREEN

on:
  push:
    branches:
      - task6-final-two-blockers-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact GREEN head
        uses: actions/checkout@v4
        with:
          ref: 50323947d059c495e19e241cb1b35386f76ec967
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 6 answer tests
        run: python -m pytest tests/unit/answer -v

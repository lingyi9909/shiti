name: Task 6 Final Two Blockers RED

on:
  push:
    branches:
      - task6-final-two-blockers-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: c71f233130652e59434c8644eca759dcd7257c23
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run final blocker regressions
        run: python -m pytest tests/unit/answer/test_final_two_blocker_regressions.py -v

name: Task 10 Verification

on:
  push:
    branches:
      - task10-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 10 resume provenance RED head
        uses: actions/checkout@v4
        with:
          ref: 30f4f23eedece07ad38359ec09bf0d01eacd12f9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 10 resume provenance RED
        run: python -m pytest tests/unit/storage/test_db.py -v

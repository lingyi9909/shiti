name: Task 10 Verification

on:
  push:
    branches:
      - task10-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 10 RED head
        uses: actions/checkout@v4
        with:
          ref: f50123816e4123f91a4963267a4ac376bd76ece9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 10 RED
        run: python -m pytest tests/unit/storage tests/unit/cache -v

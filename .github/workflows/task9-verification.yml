name: Task 9 Verification

on:
  push:
    branches:
      - task9-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 9 implementation head
        uses: actions/checkout@v4
        with:
          ref: 21cee347a8c37f86d8f931d1309aa2823e11f662
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 9 GREEN
        run: python -m pytest tests/unit/quality -v

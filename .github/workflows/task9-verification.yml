name: Task 9 Verification

on:
  push:
    branches:
      - task9-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 9 test head
        uses: actions/checkout@v4
        with:
          ref: 0f124d4f9be1f2126a5c55be3e0c75d1251459e5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 9 RED
        run: python -m pytest tests/unit/quality -v

name: Task 9 Verification

on:
  push:
    branches:
      - task9-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 9 scaffold head
        uses: actions/checkout@v4
        with:
          ref: b0b535e703e53cda8c8c5b00773519ea5480d4b3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 9 behavior RED
        run: python -m pytest tests/unit/quality -v

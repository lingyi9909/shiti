name: Task 9 Verification

on:
  push:
    branches:
      - task9-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 9 blocker RED head
        uses: actions/checkout@v4
        with:
          ref: ed421538a9bfbb0a435882294111ccf82bcd395d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 9 blocker RED
        run: python -m pytest tests/unit/quality -v

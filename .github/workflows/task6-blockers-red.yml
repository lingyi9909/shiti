name: Task 6 Blockers RED

on:
  push:
    branches:
      - task6-blockers-red-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: d4aa42bd9843959bd7c473c3bf6e1b111c472f4a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 6 answer RED tests
        run: python -m pytest tests/unit/answer -v

name: Task 4 Verification

on:
  push:
    branches: [task4-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 4 head
        uses: actions/checkout@v4
        with:
          ref: 33c7195a8b2d3a177fa89c3df675ec6536ebb5c6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 4 tests
        run: python -m pytest tests/unit/understanding -v

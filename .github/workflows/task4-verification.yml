name: Task 4 Verification

on:
  push:
    branches: [task4-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 4 head
        uses: actions/checkout@v4
        with:
          ref: 22a64d803b97e23b8f19f2082c231794da266716
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 4 tests
        run: python -m pytest tests/unit/understanding -v

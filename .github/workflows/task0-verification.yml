name: Task 0 Exact Head Verification

on:
  push:
    branches:
      - task0-verification

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Task 0 head
        uses: actions/checkout@v4
        with:
          ref: 315a9dab1438db701a8545786e10d8966a2ac44c

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Pytest
        run: python -m pytest tests/unit/test_config.py tests/unit/test_domain_models.py -v

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src/question_builder/config src/question_builder/domain

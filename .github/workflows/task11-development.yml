name: Task 11 Development Verification

on:
  push:
    branches:
      - task11-pipeline-orchestrator-cli

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Task 11 test head
        uses: actions/checkout@v4
        with:
          ref: 33f84c67cfc97ddbfce9e5c221123de3fb0acfc4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 11 RED
        run: python -m pytest tests/unit/pipeline tests/unit/cli -v

name: Task 7 Verification

on:
  push:
    branches:
      - task7-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 7 implementation head
        uses: actions/checkout@v4
        with:
          ref: cede1a329396635c69dd29ab6c8ef14f47f49596
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Show Ruff auto-fix diff
        run: python -m ruff check src/question_builder/matching tests/unit/matching tests/golden/test_answer_matching_precision.py --fix --diff || true

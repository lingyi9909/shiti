name: Task 7 Verification

on:
  push:
    branches:
      - task7-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 7 scaffold head
        uses: actions/checkout@v4
        with:
          ref: a06071a693739368b36a33993d2aad2a92eb2ee4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run Task 7 scaffold GREEN
        run: python -m pytest tests/unit/matching/test_scaffold.py -v

name: Task 6 Four Blockers Full Verification 2

on:
  push:
    branches:
      - task6-four-blockers-full-verification2

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 6 fix head
        uses: actions/checkout@v4
        with:
          ref: 2ee96edf5828ea1767f96c8e6bb7aa385db0a23a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 6 tests
        run: python -m pytest tests/unit/answer -v
      - name: Task 5 regression
        run: python -m pytest tests/unit/splitter tests/golden/test_question_reconstruction.py -v
      - name: Task 4 regression
        run: python -m pytest tests/unit/understanding -v
      - name: Task 3 regression
        run: python -m pytest tests/contract tests/unit/recognition -v
      - name: Task 0-2 regression
        run: python -m pytest tests/unit/test_config.py tests/unit/test_domain_models.py tests/unit/parser tests/golden/test_basic_document_ir.py tests/golden/test_advanced_document_ir.py -v
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/question_builder/config src/question_builder/domain src/question_builder/parser src/question_builder/recognition src/question_builder/understanding src/question_builder/splitter src/question_builder/answer src/question_builder/export

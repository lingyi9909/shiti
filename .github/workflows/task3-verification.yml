name: Task 3 Verification

on:
  push:
    branches: [task3-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 3 head
        uses: actions/checkout@v4
        with:
          ref: 3c3018c76499d11eb003da2e5d75ae25ffc38ee0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 3 tests
        run: python -m pytest tests/contract tests/unit/recognition -v

name: Task 3 Verification

on:
  push:
    branches: [task3-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 3 head
        uses: actions/checkout@v4
        with:
          ref: d88d7fd1d58e4c5e56c1a679de37cfab02c03f50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 3 tests
        run: python -m pytest tests/contract tests/unit/recognition -v

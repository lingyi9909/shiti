name: Task 3 Verification

on:
  push:
    branches: [task3-verification]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Task 3 head
        uses: actions/checkout@v4
        with:
          ref: 0555b8532996d36b4cd552e211b42c03e74e0f55
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 3 tests
        run: python -m pytest tests/contract tests/unit/recognition -v
      - name: Task 0-2 regression
        run: python -m pytest tests/unit/test_config.py tests/unit/test_domain_models.py tests/unit/parser tests/golden/test_basic_document_ir.py tests/golden/test_advanced_document_ir.py -v
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/question_builder/config src/question_builder/domain src/question_builder/parser src/question_builder/recognition

name: Task 7 Blocker Verification

on:
  push:
    branches:
      - task7-blocker-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact blocker fix head
        uses: actions/checkout@v4
        with:
          ref: 423f850542f9311b6dd317e2e15b6a2a588d53db
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 7 matching and golden
        run: python -m pytest tests/unit/matching tests/golden/test_answer_matching_precision.py -v

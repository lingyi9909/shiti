name: Task 7 Blocker GREEN

on:
  push:
    branches:
      - task7-blocker-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact blocker fix head
        uses: actions/checkout@v4
        with:
          ref: cd10afb5cedf9553a8643b9527d77ba7529d9eb2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 7 blocker regressions GREEN
        run: python -m pytest tests/unit/matching/test_review_blockers.py -v

name: Task 7 Final Blocker Verification

on:
  push:
    branches:
      - task7-final-blocker-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact final blocker fix head
        uses: actions/checkout@v4
        with:
          ref: c4f3534ed3f20563e1f949bb2a7746596defcda0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 7 matching and golden
        run: python -m pytest tests/unit/matching tests/golden/test_answer_matching_precision.py -v
      - name: Task 6 regression
        run: python -m pytest tests/unit/answer -v
      - name: Task 5 regression
        run: python -m pytest tests/unit/splitter tests/golden/test_question_reconstruction.py -v
      - name: Task 4 regression
        run: python -m pytest tests/unit/understanding -v
      - name: Task 3 regression
        run: python -m pytest tests/contract tests/unit/recognition -v
      - name: Task 0-2 regression
        run: python -m pytest tests/unit/test_config.py tests/unit/test_domain_models.py tests/unit/parser tests/golden/test_basic_document_ir.py tests/golden/test_advanced_document_ir.py -v
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/question_builder/config src/question_builder/domain src/question_builder/parser src/question_builder/recognition src/question_builder/understanding src/question_builder/splitter src/question_builder/answer src/question_builder/matching src/question_builder/export

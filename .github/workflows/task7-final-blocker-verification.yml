name: Task 7 Final Blocker Verification

on:
  push:
    branches:
      - task7-final-blocker-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: cab7e122b723cedfd1f18b888c05a0efeb636a13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 7 RED
        run: python -m pytest tests/unit/matching/test_review_blockers.py tests/unit/matching/test_acceptance_path.py -v

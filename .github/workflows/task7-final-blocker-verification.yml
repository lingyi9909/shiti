name: Task 7 Final Blocker Verification

on:
  push:
    branches:
      - task7-final-blocker-verification

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact GREEN head
        uses: actions/checkout@v4
        with:
          ref: c4f3534ed3f20563e1f949bb2a7746596defcda0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 7 GREEN
        run: python -m pytest tests/unit/matching tests/golden/test_answer_matching_precision.py -v
